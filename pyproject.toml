[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lightfall-voice"
description = "Voice notifications plugin for Lightfall via the local Kokoro voice daemon"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "LEGAL.md"]
requires-python = ">=3.11"
authors = [{ name = "ALS Controls Team" }]
dynamic = ["version"]
dependencies = [
    "lightfall>=0.4.0",
    "lightfall-utils>=0.3.0",
    "lightfall-settings>=0.1.4",
    "numpy",
]

[project.urls]
Repository = "https://github.com/als-controls/lightfall-voice"
Issues = "https://github.com/als-controls/lightfall-voice/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
stt-service = ["faster-whisper>=1.1", "numpy"]
gpu = ["lightfall-voice[stt-service]", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[project.entry-points."lightfall.plugins"]
lightfall_voice = "lightfall_voice.manifest:manifest"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/lightfall_voice"]

[tool.ruff.lint]
# Match lightfall-vibe: keep the pre-0.16 ruff default rule set.
select = ["E4", "E7", "E9", "F"]
